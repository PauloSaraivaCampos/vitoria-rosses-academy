async function importCourseCovers(input){

 if(!isAdmin()){alert('Apenas a administradora pode importar capas.');input.value='';return}

 const label=input.closest('label');
 if(label){label.style.opacity='0.6';label.style.pointerEvents='none'}
 try{
  const response=await fetch('/api/admin/covers/import',{method:'POST',body:file,headers:{'Content-Type':'application/zip'},credentials:'same-origin'});
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Falha ao importar as capas');

  window.location.reload()

}

 return '<div class="premium-kpis">'+kpis.map(function(k){return '<div class="premium-kpi"><div class="premium-kpi-icon">'+k[0]+'</div><span>'+k[1]+'</span><strong>'+k[2]+'</strong></div>'}).join('')+'</div>'+

 '<section class="premium-panel"><h3>Controle de mensalidades</h3><div class="premium-pay-status"><div><strong>'+paid.length+'</strong><span>Pagas</span></div><div><strong>'+pending+'</strong><span>Pendentes</span></div><div><strong>'+late+'</strong><span>Atrasadas</span></div></div><p class="muted small">Registros manuais desta demonstração, sem cobrança bancária.</p><button class="btn outline" onclick="adminTab=\'payments\';render()">Gerenciar mensalidades</button></section></div>'+

 const course=courses().find(c=>c.id===id);
 modal={title:'Vídeo da aula '+(n+1),body:
 '<p class="muted">'+esc(course?.title||'Curso')+' • '+esc(LESSONS[n]||'Aula '+(n+1))+'</p>'+
 (stored?'<div class="premium-video-status">✓ Vídeo privado já enviado para esta aula.</div>':'')+

 '<div class="premium-video-divider">OU CADASTRAR UM LINK</div>'+
 '<label>Link externo (YouTube, Vimeo ou MP4 HTTPS)<input class="field" id="premium-video-url" value="'+esc(stored?'':v)+'" placeholder="https://..."></label>'+
 '<p class="small muted">Vídeos enviados para o Railway ficam no armazenamento privado; links externos seguem as permissões do site de origem.</p>'+
 '<div class="flex" style="gap:9px;flex-wrap:wrap"><button class="btn outline" onclick="premiumSaveVideo('+id+','+n+')">Salvar link</button>'+
 (v?'<button class="btn outline" onclick="premiumRemoveVideo('+id+','+n+')">Remover vídeo</button>':'')+
 '</div>'};
 render()
}
async function premiumUploadVideo(id,n){
 if(!REMOTE_MODE)return alert('O upload direto está disponível no Railway.');
 if(!isAdmin())return alert('Somente a administradora pode enviar vídeos.');
 const file=document.getElementById('premium-video-file')?.files?.[0];
 if(!file)return alert('Escolha um vídeo para enviar.');
 if(!/\.(mp4|webm|ogv)$/i.test(file.name)||!['video/mp4','video/webm','video/ogg'].includes(file.type))return alert('Escolha um arquivo MP4, WebM ou OGG válido.');
 if(file.size>500*1024*1024)return alert('O arquivo deve ter até 500 MB.');
 const status=document.getElementById('premium-upload-status'),button=document.getElementById('premium-upload-button'),track=document.querySelector('.premium-upload-track'),bar=document.getElementById('premium-upload-bar');
 button.disabled=true;track.style.display='block';status.textContent='Iniciando envio...';
 const data=new FormData();data.append('video',file,file.name);
 const xhr=new XMLHttpRequest();
 xhr.open('POST','/api/admin/video/upload?course='+encodeURIComponent(id)+'&lesson='+encodeURIComponent(n));
 xhr.withCredentials=true;
 xhr.upload.onprogress=event=>{
  if(!event.lengthComputable)return;
  const pct=Math.min(99,Math.round(event.loaded/event.total*100));
  bar.style.width=pct+'%';status.textContent='Enviando vídeo: '+pct+'%';
 };
 xhr.onload=async()=>{
  let output={};try{output=JSON.parse(xhr.responseText)}catch{}
  if(xhr.status>=200&&xhr.status<300){
   if(status)status.textContent='Vídeo enviado com sucesso!';
   if(bar)bar.style.width='100%';
   modal=null;
   try{await remoteRefresh();adminTab='videos';render()}catch(e){alert('Vídeo enviado, mas não foi possível atualizar a lista: '+e.message)}
  }else{if(status)status.textContent=output.error||'Falha no envio do vídeo.';button.disabled=false}
 };
 xhr.onerror=()=>{status.textContent='Erro de conexão durante o envio.';button.disabled=false};
 xhr.ontimeout=()=>{status.textContent='Envio excedeu o tempo limite. Tente um arquivo menor.';button.disabled=false};
 xhr.timeout=5*60*1000;
 xhr.send(data);
}
async function premiumSaveVideo(id,n){
 const v=document.getElementById('premium-video-url')?.value.trim()||'';
 if(!v)return alert('Informe um link HTTPS. Para enviar um arquivo, use o botão Enviar vídeo.');
 if(!/^https:\/\/[^\s]+$/i.test(v))return alert('Informe um endereço HTTPS válido.');
 try{videoPlaybackInfo(v)}catch(e){return alert(e.message)}
 if(REMOTE_MODE){
  try{await remoteAPI('admin/video/link',{course:Number(id),lesson:Number(n),url:v});modal=null;await remoteRefresh();adminTab='videos';render()}
  catch(e){alert('Não foi possível salvar o vídeo: '+e.message)}
  return
 }
 state.videoLessons??={};state.videoLessons[id+':'+n]=v;save();modal=null;render()
}
async function premiumRemoveVideo(id,n){
 if(!confirm('Remover o vídeo desta aula?'))return;
 if(REMOTE_MODE){
  try{await remoteAPI('admin/video/remove',{course:id,lesson:n});modal=null;await remoteRefresh();adminTab='videos';render()}
  catch(e){alert(e.message)}
  return
 }
 delete state.videoLessons?.[id+':'+n];save();modal=null;render()
}
