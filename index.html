</style></head><body><div id="root"></div><script>
const COURSES=[['Alongamento em Fibra de Vidro',1,12,'Do zero à aplicação profissional de fibra de vidro.'],['Blindagem de Unhas',2,10,'Resistência e acabamento para unhas naturais.'],['Esmaltação em Gel',3,8,'Preparação, aplicação e acabamento perfeito.'],['Alongamento em Gel',4,15,'Estruturação, curvatura e nivelamento.'],['Nail Art Premium',5,12,'Decorações, francesinhas e técnicas modernas.'],['Manutenção Profissional',6,9,'Manutenção segura e durabilidade.'],['Preparação e Biossegurança',7,7,'Cuidados, higiene e preparação da cliente.'],['Esmaltação Tradicional',8,8,'Técnicas clássicas e acabamento refinado.']].map((c,i)=>({id:i+1,title:c[0],img:'nails'+c[1]+'.jpg',count:c[2],desc:c[3]}));
const LESSONS=['Boas-vindas e visão geral','Materiais e ferramentas necessárias','Biossegurança e higienização','Preparação da unha natural','Técnica completa — Parte 1','Técnica completa — Parte 2','Curvatura e nivelamento','Lixamento técnico','Acabamento e finalização','Erros comuns e como evitar','Manutenção e remoção','Avaliação final'];
const PLANS=[{id:'essencial',name:'Essencial',price:97,access:[1,3,7],months:6},{id:'profissional',name:'Profissional',price:197,access:[1,2,3,4,5,7,8],months:12},{id:'master',name:'Master VIP',price:397,access:COURSES.map(c=>c.id),months:24}];
const KEY='vra_demo_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[{name:'Aluna Demonstração',email:'aluna@demo.com',password:'123456',role:'student',plans:['essencial'],grants:{},progress:{}}],orders:[],globalLocks:{},customCourses:[],settings:{}};let session=JSON.parse(sessionStorage.getItem('vra_session')||'null'),page='home',selectedCourse=1,selectedLesson=0,courseTab='aulas',adminTab='dashboard',query='',modal=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const current=()=>state.users.find(u=>u.email===session?.email);const courses=()=>[...COURSES,...state.customCourses];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const isAdmin=()=>current()?.role==='admin';const hasCourse=(u,id)=>isAdmin()||u?.grants?.[id]===true||u?.plans?.some(p=>PLANS.find(z=>z.id===p)?.access.includes(Number(id)));const unlocked=(u,id,n)=>hasCourse(u,id)&&state.globalLocks[id+':'+n]!==true&&u?.grants?.[id+':'+n]!==false;const done=(id,n)=>!!current()?.progress?.[id+':'+n];const progress=id=>Math.round(100*LESSONS.filter((_,i)=>done(id,i)).length/LESSONS.length);const go=p=>{page=p;modal=null;render();window.scrollTo(0,0)};
function render(){let root=document.getElementById('root');root.innerHTML=!session?login():`<div class="app">${header()}${isAdmin()&&page==='admin'?admin():page==='home'?home():page==='catalog'?catalog():page==='mine'?mine():page==='course'?course():page==='plans'?plans():page==='profile'?profile():home()}<div class="foot">© Vitória Rosses Academy • Protótipo de testes • Pagamentos e acesso apenas demonstrativos</div></div>${modal?modalHTML():''}`;}
function header(){return `<header class="top"><div class="logo">VR <span style="font-size:13px">VITÓRIA ROSSES</span><small>NAIL DESIGNER ACADEMY</small></div><nav class="nav">${[['home','Início'],['catalog','Cursos'],['mine','Meus cursos'],['plans','Planos'],...(isAdmin()?[['admin','Administração']]:[])].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${t}</button>`).join('')}</nav><div class="right"><button class="ghost" onclick="go('profile')">${esc(current().name)}</button><img class="avatar" src="vitoria.jpg"><button class="ghost" onclick="logout()">Sair</button></div></header>`}
function login(){return `<div class="login"><div class="login-art"><div class="login-brand"><strong>VR</strong><h2>VITÓRIA ROSSES</h2><small>NAIL DESIGNER</small><p>ELEVANDO A SUA AUTOESTIMA</p></div><div class="login-form"><div class="panel"><h2>Bem-vinda</h2><p>Faça seu login para acessar seus cursos</p><label class="login-field">♙ <input id="email" type="email" placeholder="Seu e-mail" value="aluna@demo.com"></label><label class="login-field">♙ <input id="password" type="password" placeholder="Sua senha" value="123456"><button onclick="togglePass()" aria-label="Mostrar senha">◉</button></label><div class="login-options"><label><input type="checkbox"> Lembrar de mim</label><a href="#" onclick="event.preventDefault();alert('Recuperação de senha disponível na versão comercial')">Esqueci minha senha</a></div><button class="btn" style="width:100%" onclick="loginSubmit()">Entrar</button><div class="login-social">ou continue com<br><span>Google &nbsp; • &nbsp; Apple &nbsp; • &nbsp; WhatsApp</span></div><p class="small">Ainda não tem conta? <a href="#" onclick="event.preventDefault();registerForm()">Criar conta</a></p><details><summary>Contas de teste</summary><p class="small">aluna@demo.com / 123456<br>admin@demo.com / 123456</p><button class="btn outline tiny" onclick="loginDemoAdmin()">Entrar como administradora</button></details></div></div></div></div>${modal?modalHTML():''}`}
function togglePass(){let x=document.getElementById('password');x.type=x.type==='password'?'text':'password'}
function loginSubmit(){let email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('password').value;let u=state.users.find(x=>x.email===email&&x.password===pass);if(!u)return alert('E-mail ou senha incorretos.');session={email};sessionStorage.setItem('vra_session',JSON.stringify(session));go(u.role==='admin'?'admin':'home')}
function loginDemoAdmin(){if(!state.users.find(u=>u.email==='admin@demo.com'))state.users.push({name:'Vitória Rosses (Admin)',email:'admin@demo.com',password:'123456',role:'admin',plans:[],grants:{},progress:{}});save();session={email:'admin@demo.com'};sessionStorage.setItem('vra_session',JSON.stringify(session));go('admin')}
function registerForm(){modal={title:'Criar minha conta',body:`<input class="field" id="newname" placeholder="Nome completo"><input class="field" id="newemail" type="email" placeholder="E-mail"><input class="field" id="newpass" type="password" placeholder="Senha"><button class="btn" onclick="register()">Criar conta</button>`};render()}
function register(){let name=document.getElementById('newname').value.trim(),email=document.getElementById('newemail').value.trim().toLowerCase(),password=document.getElementById('newpass').value;if(!name||!email.includes('@')||password.length<6)return alert('Preencha nome, e-mail e senha de no mínimo 6 caracteres.');if(state.users.some(u=>u.email===email))return alert('E-mail já cadastrado');state.users.push({name,email,password,role:'student',plans:[],grants:{},progress:{}});save();session={email};sessionStorage.setItem('vra_session',JSON.stringify(session));go('home')}
function logout(){session=null;sessionStorage.removeItem('vra_session');page='home';render()}
function card(c){let access=hasCourse(current(),c.id);return `<article class="course" onclick="openCourse(${c.id})"><img src="${c.img}" onerror="this.src='nails1.jpg'"><span class="lock">${access?'✦ Liberado':'🔒 Bloqueado'}</span><div class="info"><h3>${esc(c.title)}</h3><div class="muted small">${c.count} aulas • PDFs e materiais</div>${access?`<div class="bar"><i style="width:${progress(c.id)}%"></i></div><span class="small muted">${progress(c.id)}% concluído</span>`:`<div style="margin-top:13px;color:#e6aaa7" class="small">Conhecer curso →</div>`}</div></article>`}
function home(){return `<main class="page"><div class="hero"><div><div class="eyebrow">VITÓRIA ROSSES • CURSOS PROFISSIONAIS</div><h1>Domine a arte das unhas com elegância.</h1><p>Uma experiência exclusiva de aprendizado, do primeiro passo às técnicas mais avançadas.</p><button class="btn" onclick="openCourse(1)">▶ Começar a assistir</button> <button class="btn outline" onclick="go('catalog')">Explorar cursos</button></div></div><div class="flex space"><h2 class="section-title">Continue assistindo</h2><button class="ghost" onclick="go('mine')">Ver todos →</button></div><div class="cards">${courses().filter(c=>hasCourse(current(),c.id)).slice(0,4).map(card).join('')||'<p class="muted">Escolha um pacote para começar sua jornada.</p>'}</div><h2 class="section-title">Descubra novas técnicas</h2><div class="cards">${courses().map(card).join('')}</div></main>`}
function catalog(){let list=courses().filter(c=>c.title.toLowerCase().includes(query.toLowerCase()));return `<main class="page"><h1 class="serif">Todos os cursos</h1><p class="muted">Descubra técnicas profissionais e evolua no seu ritmo.</p><input class="field search" placeholder="Buscar cursos..." value="${esc(query)}" oninput="query=this.value;document.getElementById('results').innerHTML=courses().filter(c=>c.title.toLowerCase().includes(query.toLowerCase())).map(card).join('')"><div id="results" class="cards">${list.map(card).join('')}</div></main>`}
function mine(){return `<main class="page"><h1 class="serif">Meus cursos</h1><p class="muted">Sua jornada de aprendizado, em um só lugar.</p><div class="cards">${courses().filter(c=>hasCourse(current(),c.id)).map(card).join('')||'<p class="muted">Você ainda não tem cursos liberados.</p>'}</div><p><button class="btn" onclick="go('plans')">Explorar pacotes</button></p></main>`}
function openCourse(id){selectedCourse=id;selectedLesson=0;courseTab='aulas';go('course')}
function course(){let c=courses().find(c=>c.id===selectedCourse)||courses()[0],u=current(),access=hasCourse(u,c.id),allow=unlocked(u,c.id,selectedLesson);return `<main class="page"><button class="ghost" onclick="go('catalog')">← Voltar aos cursos</button><div class="grid2"><section><div class="video"><img src="${c.img}"><button onclick="${allow?'playVideo()':'showLocked()'}">${allow?'▶':'🔒'}</button></div><h1 class="serif">${esc(c.title)}</h1><p class="muted">${esc(c.desc)}</p><div class="flex"><span class="pill">${access?'✓ Curso liberado':'🔒 Curso bloqueado'}</span><span class="muted">${progress(c.id)}% concluído</span></div><div class="bar"><i style="width:${progress(c.id)}%"></i></div><div class="tabs">${[['aulas','Aulas'],['materiais','Material de apoio'],['lista','Lista de materiais'],['notas','Anotações']].map(([id,t])=>`<button class="${courseTab===id?'active':''}" onclick="courseTab='${id}';render()">${t}</button>`).join('')}</div>${courseTab==='aulas'?`<div class="panel"><h3>${esc(LESSONS[selectedLesson])}</h3><p class="muted">Aula ${selectedLesson+1} de ${c.count}. Aprenda cada etapa com atenção aos detalhes.</p>${allow?`<button class="btn" onclick="markDone()">${done(c.id,selectedLesson)?'✓ Aula concluída':'Marcar aula como concluída'}</button>`:`<div class="notice">Esta aula está bloqueada. Solicite a liberação ou adquira o pacote correspondente.</div><button class="btn" onclick="go('plans')">Ver pacotes</button>`}</div>`:courseTab==='materiais'?`<div class="panel"><h3>PDF passo a passo</h3><p class="muted">Material demonstrativo para acompanhar a técnica.</p><button class="btn" ${!allow?'disabled':''} onclick="downloadPDF()">⬇ Baixar PDF da aula</button></div>`:courseTab==='lista'?`<div class="panel"><h3>Checklist de materiais</h3>${['Lixa e bloco polidor','Cabine UV/LED','Primer e desidratador','Gel base e gel construtor','Pincel profissional','Luvas e itens de biossegurança'].map(t=>`<label style="display:block;margin:14px"><input type="checkbox" class="switch"> ${t}</label>`).join('')}</div>`:`<div class="panel"><h3>Minhas anotações</h3><textarea id="note" class="field" rows="5" placeholder="Escreva suas anotações...">${esc(u.notes?.[c.id+':'+selectedLesson]||'')}</textarea><button class="btn" onclick="saveNote()">Salvar anotações</button></div>`}</section><aside><div class="panel"><div class="flex space"><h3>Conteúdo do curso</h3><span class="pill">${c.count} aulas</span></div>${LESSONS.slice(0,c.count).map((t,i)=>`<div class="lesson ${selectedLesson===i?'selected':''}" onclick="selectedLesson=${i};render()"><img src="nails${(i%12)+1}.jpg"><span><b class="small">${i+1}. ${t}</b><small>${(8+i*2)%23+5}:20 min</small></span><b>${unlocked(u,c.id,i)?done(c.id,i)?'✓':'▶':'🔒'}</b></div>`).join('')}</div></aside></div></main>`}
function showLocked(){alert('Conteúdo bloqueado. Consulte os pacotes ou solicite liberação à administradora.')};function playVideo(){modal={title:'Player de vídeo — demonstração',body:'<div class="notice">A estrutura do player está pronta para receber os vídeos reais. Nenhum vídeo foi enviado ainda.</div><p class="muted">Na versão publicada, os vídeos serão privados e terão controle de acesso pelo servidor.</p>'};render()};function markDone(){let k=selectedCourse+':'+selectedLesson;current().progress[k]=!current().progress[k];save();render()};function saveNote(){current().notes??={};current().notes[selectedCourse+':'+selectedLesson]=document.getElementById('note').value;save();alert('Anotação salva!')}
function downloadPDF(){let c=courses().find(c=>c.id===selectedCourse),body=`VITÓRIA ROSSES ACADEMY\n\n${c.title}\nAula ${selectedLesson+1}: ${LESSONS[selectedLesson]}\n\nCHECKLIST\n- Higienizar as mãos e a bancada\n- Separar materiais e equipamentos\n- Preparar a unha natural\n- Executar o procedimento conforme orientação da professora\n- Conferir acabamento e cuidados finais\n\nMaterial demonstrativo. Substituir pelo PDF oficial da professora.`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));a.download='material-aula-'+(selectedLesson+1)+'.txt';a.click();URL.revokeObjectURL(a.href)}
function plans(){return `<main class="page"><div style="text-align:center"><div class="eyebrow">INVISTA NO SEU FUTURO</div><h1 class="serif" style="font-size:42px">Escolha seu plano</h1><p class="muted">Cursos, aulas e materiais para cada etapa da sua evolução.</p></div><div class="plans">${PLANS.map((p,i)=>`<div class="plan ${i===1?'featured':''}"><span class="eyebrow">${i===1?'MAIS ESCOLHIDO':'ACADEMIA PREMIUM'}</span><h2>${p.name}</h2><p class="muted">${p.access.length} cursos • ${p.months} meses de acesso</p><div class="price">R$ ${p.price},00</div><ul><li>${p.access.length} cursos liberados</li><li>Vídeos e materiais de apoio</li><li>Progresso individual</li><li>PDFs das aulas</li><li>Suporte para alunas</li></ul><button class="btn" style="width:100%" onclick="buy('${p.id}')">${current().plans.includes(p.id)?'Pacote adquirido':'Escolher pacote'}</button></div>`).join('')}</div><div class="notice">Ambiente de demonstração: nenhuma cobrança real será feita.</div></main>`}
function buy(id){let p=PLANS.find(p=>p.id===id);modal={title:'Finalizar compra • '+p.name,body:`<p>Valor: <strong>R$ ${p.price},00</strong></p><p class="muted">Escolha uma forma de pagamento para simular a compra.</p><div class="flex"><button class="btn" onclick="finishBuy('${id}','Pix')">Simular Pix</button><button class="btn outline" onclick="finishBuy('${id}','Cartão')">Simular cartão</button></div><p class="small muted">Sem transação financeira. Liberação somente neste navegador.</p>`};render()}
function finishBuy(id,method){let u=current(),p=PLANS.find(x=>x.id===id);if(!u.plans.includes(id))u.plans.push(id);state.orders.push({email:u.email,plan:id,price:p.price,method,status:'Simulado',date:new Date().toLocaleDateString('pt-BR')});save();modal={title:'✓ Acesso liberado!',body:`<p>Seu pacote ${p.name} foi liberado para testes.</p><button class="btn" onclick="go('mine')">Ir para meus cursos</button>`};render()}
function profile(){return `<main class="page"><h1 class="serif">Minha conta</h1><div class="panel" style="max-width:600px"><p><b>Nome:</b> ${esc(current().name)}</p><p><b>E-mail:</b> ${esc(current().email)}</p><p><b>Pacotes:</b> ${current().plans.map(esc).join(', ')||'Nenhum'}</p><button class="btn outline" onclick="logout()">Sair da conta</button></div></main>`}
function admin(){return `<div class="admin"><aside class="sidebar">${[['dashboard','◈ Dashboard'],['courses','▣ Cursos e módulos'],['students','♙ Alunas'],['permissions','🔒 Liberações'],['orders','◉ Vendas'],['settings','⚙ Configurações']].map(([id,t])=>`<button class="${adminTab===id?'active':''}" onclick="adminTab='${id}';render()">${t}</button>`).join('')}</aside><main class="page" style="width:100%"><div class="flex space"><div><div class="eyebrow">ÁREA ADMINISTRATIVA</div><h1 class="serif">${({dashboard:'Visão geral',courses:'Cursos e módulos',students:'Alunas cadastradas',permissions:'Controle de acesso',orders:'Vendas',settings:'Configurações'})[adminTab]}</h1></div><span class="pill">Modo demonstração</span></div>${adminTab==='dashboard'?adminDashboard():adminTab==='courses'?adminCourses():adminTab==='students'?adminStudents():adminTab==='permissions'?adminPermissions():adminTab==='orders'?adminOrders():adminSettings()}</main></div>`}
function adminDashboard(){return `<div class="stats"><div class="stat">Alunas<strong>${state.users.filter(u=>u.role==='student').length}</strong></div><div class="stat">Vendas simuladas<strong>${state.orders.length}</strong></div><div class="stat">Cursos<strong>${courses().length}</strong></div><div class="stat">Aulas<strong>${courses().reduce((s,c)=>s+c.count,0)}</strong></div></div><h2 class="section-title">Últimas compras</h2>${adminOrders()}<h2 class="section-title">Gerenciamento rápido</h2><div class="flex"><button class="btn" onclick="adminTab='courses';render()">Gerenciar cursos</button><button class="btn outline" onclick="adminTab='permissions';render()">Controlar aulas</button></div>`}
function adminCourses(){return `<div class="flex space"><p class="muted">Configure os cursos e bloqueie aulas individualmente.</p><button class="btn" onclick="newCourse()">+ Novo curso</button></div>${courses().map(c=>`<div class="panel" style="margin-bottom:15px"><div class="flex space"><div class="flex"><img src="${c.img}" width="65" height="65" style="object-fit:cover;border-radius:7px"><div><b>${esc(c.title)}</b><div class="muted small">${c.count} aulas</div></div></div><button class="btn tiny" onclick="selectedCourse=${c.id};adminTab='permissions';render()">Gerenciar aulas</button></div></div>`).join('')}`}
function newCourse(){modal={title:'Adicionar curso',body:`<input class="field" id="ctitle" placeholder="Nome do curso"><textarea class="field" id="cdesc" placeholder="Descrição"></textarea><input class="field" id="ccount" type="number" min="1" max="12" value="8"><button class="btn" onclick="createCourse()">Criar curso</button><p class="small muted">Novos cursos usam imagem demonstrativa até o envio das capas reais.</p>`};render()};function createCourse(){let title=document.getElementById('ctitle').value.trim(),desc=document.getElementById('cdesc').value,count=Math.min(12,Math.max(1,+document.getElementById('ccount').value||8));if(!title)return alert('Informe o título');state.customCourses.push({id:Math.max(...courses().map(c=>c.id))+1,title,desc,count,img:'nails9.jpg'});save();modal=null;adminTab='courses';render()}
function adminStudents(){return `<div class="panel"><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Pacotes</th><th>Ação</th></tr></thead><tbody>${state.users.filter(u=>u.role==='student').map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.plans.join(', ')||'—'}</td><td><button class="btn tiny" onclick="adminTab='permissions';document.body.dataset.student='${esc(u.email)}';render()">Gerenciar acesso</button></td></tr>`).join('')}</tbody></table></div>`}
function adminPermissions(){let students=state.users.filter(u=>u.role==='student'),email=students.find(u=>u.email===document.body.dataset.student)?.email||students[0]?.email,u=students.find(u=>u.email===email);if(!u)return '<div class="notice">Cadastre uma aluna primeiro.</div>';return `<div class="panel"><div class="flex"><label>Aluna <select class="field" onchange="document.body.dataset.student=this.value;render()">${students.map(x=>`<option value="${esc(x.email)}" ${x.email===email?'selected':''}>${esc(x.name)} (${esc(x.email)})</option>`).join('')}</select></label><label>Curso <select class="field" onchange="selectedCourse=+this.value;render()">${courses().map(c=>`<option value="${c.id}" ${c.id===selectedCourse?'selected':''}>${esc(c.title)}</option>`).join('')}</select></label></div><div class="notice small">Liberação individual sobrepõe o pacote. O bloqueio global impede acesso de todas as alunas. Alterações são salvas neste navegador.</div><div class="flex space"><b>Curso completo liberado manualmente</b><input type="checkbox" class="switch" ${u.grants[selectedCourse]===true?'checked':''} onchange="setGrant('${esc(email)}','${selectedCourse}',this.checked)"></div><hr style="border-color:#392b32;margin:20px 0"><h3>Aulas e vídeos</h3>${LESSONS.slice(0,courses().find(c=>c.id===selectedCourse)?.count||12).map((t,i)=>`<div class="lesson"><span>${i+1}. ${t}<small>${unlocked(u,selectedCourse,i)?'Liberada':'Bloqueada'}</small></span><label class="small">Bloqueio global <input type="checkbox" class="switch" ${state.globalLocks[selectedCourse+':'+i]?'checked':''} onchange="setGlobal(${selectedCourse},${i},this.checked)"></label><label class="small">Bloqueio individual <input type="checkbox" class="switch" ${u.grants[selectedCourse+':'+i]===false?'checked':''} onchange="setIndividual('${esc(email)}',${selectedCourse},${i},this.checked)"></label></div>`).join('')}</div>`}
function setGrant(email,id,v){state.users.find(u=>u.email===email).grants[id]=v;save();render()}function setGlobal(id,i,v){state.globalLocks[id+':'+i]=v;save();render()}function setIndividual(email,id,i,v){state.users.find(u=>u.email===email).grants[id+':'+i]=v?false:true;save();render()}
function adminOrders(){return `<div class="panel"><table class="table"><thead><tr><th>Aluna</th><th>Pacote</th><th>Valor</th><th>Forma</th><th>Status</th></tr></thead><tbody>${state.orders.map(o=>`<tr><td>${esc(o.email)}</td><td>${esc(o.plan)}</td><td>R$ ${o.price},00</td><td>${esc(o.method)}</td><td><span class="pill">${esc(o.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Nenhuma compra simulada ainda.</td></tr>'}</tbody></table></div>`}
function adminSettings(){return `<div class="panel"><h3>Configurações da academia</h3><label>Nome público<input class="field" id="brand" value="${esc(state.settings.brand||'Vitória Rosses Academy')}"></label><label>Mensagem de boas-vindas<textarea class="field" id="welcome">${esc(state.settings.welcome||'Elevando a sua autoestima')}</textarea></label><button class="btn" onclick="state.settings.brand=document.getElementById('brand').value;state.settings.welcome=document.getElementById('welcome').value;save();alert('Configurações salvas para testes')">Salvar</button><div class="notice">Integração real de pagamentos, e-mails, certificados e upload de vídeos requer servidor e credenciais de produção.</div><button class="btn outline" onclick="if(confirm('Apagar os dados de teste deste navegador?')){localStorage.removeItem(KEY);sessionStorage.removeItem('vra_session');location.reload()}">Restaurar dados de demonstração</button></div>`}
function modalHTML(){return `<div class="modalbg" onclick="if(event.target===this){modal=null;render()}"><div class="modal"><button class="close" onclick="modal=null;render()">×</button><h2 class="serif">${esc(modal.title)}</h2>${modal.body}</div></div>`}
render();
</script></body></html>
